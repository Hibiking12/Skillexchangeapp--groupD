<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コード辞典</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f8fc;--card:#ffffff;--line:#c2d4e8;--line-soft:#dde9f5;
  --text:#152233;--dim:#6e8099;
  --accent:#2f6fed;--accent-soft:#e8f0fe;
  --ok:#2f9e5c;--ng:#d6493f;
  --sans:'Noto Sans JP',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;line-height:1.5;}
button,input{font-family:inherit;}
details>summary{cursor:pointer;}
details>summary::-webkit-details-marker{display:none;}

/* ---- login ---- */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-card{width:100%;max-width:360px;padding:32px 28px;border:1px solid var(--line);border-radius:10px;background:var(--card);}
.login-card h1{font-size:22px;font-weight:700;margin-bottom:6px;text-align:center;}
.login-card .sub{color:var(--dim);font-size:13px;text-align:center;margin-bottom:32px;}
.tabs{display:flex;gap:24px;justify-content:center;margin-bottom:28px;border-bottom:1px solid var(--line);}
.tabs button{padding:0 0 12px;border:none;background:none;color:var(--dim);cursor:pointer;font-size:14px;border-bottom:2px solid transparent;}
.tabs button.on{color:var(--text);border-color:var(--accent);}
.field{margin-bottom:18px;}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:8px;}
.field input{width:100%;background:none;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:9px 10px;font-size:15px;outline:none;}
.field input:focus{border-color:var(--accent);}
#go{width:100%;padding:13px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;margin-top:14px;}
#msg{font-size:13px;text-align:center;margin-top:14px;min-height:16px;}
#msg.err{color:var(--ng);}
#msg.ok{color:var(--ok);}

/* ---- app shell ---- */
#app{display:none;flex-direction:column;flex:1;}
header{padding:22px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
header h1{font-size:18px;font-weight:700;}
.who{font-size:12px;color:var(--dim);margin-left:auto;}
.who button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;margin-left:10px;}
.who button:hover{color:var(--text);}
nav.tabs2{display:flex;gap:28px;padding:0 32px;border-bottom:1px solid var(--line);}
nav.tabs2 button{padding:14px 0;border:none;background:none;color:var(--dim);cursor:pointer;font-size:14px;border-bottom:2px solid transparent;}
nav.tabs2 button.on{color:var(--text);border-color:var(--accent);}

/* ---- shared lang toggle ---- */
.langtoggle{display:flex;gap:6px;}
.langtoggle button{font-family:var(--mono);font-size:12px;padding:6px 14px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;border-radius:5px;}
.langtoggle button.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ---- usage guide ---- */
#guide{background:var(--accent-soft);border-bottom:1px solid var(--line);padding:18px 32px;}
.guide-inner{max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:flex-start;}
.guide-text{flex:1;}
.guide-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px;}
.guide-text ul{margin:0;padding-left:18px;font-size:13px;line-height:1.85;color:#334a63;}
.guide-text strong{color:var(--accent);}
.guide-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;padding:2px 4px;}
.guide-close:hover{color:var(--text);}

/* ---- dict ---- */
#dict{display:none;flex:1;flex-direction:column;padding:24px 32px 70px;overflow-y:auto;max-width:760px;width:100%;margin:0 auto;}
.toolbar{display:flex;flex-direction:column;gap:14px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.toolrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;width:100%;}
#q{flex:1;min-width:160px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:9px 10px;outline:none;font-size:14px;}
#q:focus{border-color:var(--accent);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;padding:6px 12px;border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;border-radius:999px;}
.chip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
.entry{border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px;}
.entry-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.entry-top b{font-size:17px;font-weight:700;}
.entry-top .read{font-family:var(--mono);font-size:12px;color:var(--dim);}
.entry-top .tag{margin-left:auto;font-size:11px;color:var(--dim);}
.entry p{font-size:14px;line-height:1.75;margin-bottom:14px;color:#3a3a3a;}
.entry p .k{color:var(--text);font-weight:600;}
.code{border:1px solid var(--line-soft);border-radius:6px;overflow:hidden;}
.code .lbl{font-family:var(--mono);font-size:11px;color:var(--dim);padding:6px 12px;border-bottom:1px solid var(--line-soft);}
.code pre{background:#f4f4f4;padding:12px 14px;font-family:var(--mono);font-size:12.5px;color:#2a2a2a;overflow-x:auto;line-height:1.6;}
.code pre .c{color:#999;}
.empty{text-align:center;padding:60px 0;color:var(--dim);font-size:13px;}

/* ---- learn (cards + progress) ---- */
#learn{display:none;flex:1;flex-direction:column;align-items:center;padding:30px 16px 70px;}
.stats{width:100%;max-width:560px;display:flex;gap:24px;flex-wrap:wrap;margin-bottom:22px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;}
.stat .n{font-family:var(--mono);font-size:20px;font-weight:700;}
.stat .l{font-size:11px;color:var(--dim);margin-top:2px;}
.bar{width:100%;max-width:560px;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.score{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);}
.score .o{color:var(--ok);} .score .x{color:var(--ng);}
.pbar{width:100%;max-width:560px;height:3px;background:var(--line-soft);margin-bottom:32px;overflow:hidden;border-radius:2px;}
.pbar i{display:block;height:100%;background:var(--accent);width:0;}
.card{width:100%;max-width:560px;min-height:280px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 30px;cursor:pointer;display:flex;flex-direction:column;}
.card .lbl{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:22px;}
.card .term{font-size:30px;font-weight:700;margin-bottom:8px;}
.card .read{font-family:var(--mono);font-size:13px;color:var(--dim);}
.card .hint{margin-top:auto;text-align:center;font-size:13px;color:var(--dim);}
.card .def{font-size:14px;line-height:1.75;margin-bottom:16px;color:#3a3a3a;}
.card .def .k{color:var(--text);font-weight:600;}
.answers{width:100%;max-width:560px;display:flex;gap:12px;margin-top:20px;}
.answers button{flex:1;padding:13px;border-radius:6px;font-size:14px;cursor:pointer;background:none;}
.answers .no{border:1px solid var(--ng);color:var(--ng);}
.answers .yes{border:1px solid var(--ok);color:var(--ok);}
.answers.hide{visibility:hidden;}
.navrow{display:flex;gap:16px;align-items:center;margin-top:18px;}
.navrow button{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--dim);cursor:pointer;font-size:13px;}
.navrow button:hover:not(:disabled){color:var(--accent);border-color:var(--accent);}
.navrow button:disabled{opacity:.3;}
.navrow span{font-family:var(--mono);font-size:13px;color:var(--dim);}
.done{text-align:center;padding:40px 0;max-width:560px;width:100%;}
.done h2{font-size:22px;font-weight:700;margin-bottom:24px;}
.done .nums{display:flex;gap:16px;justify-content:center;margin-bottom:28px;}
.done .nums div{text-align:center;border:1px solid var(--line);border-radius:8px;padding:14px 24px;}
.done .nums .n{font-family:var(--mono);font-size:28px;font-weight:700;}
.done .nums .n.o{color:var(--ok);} .done .nums .n.x{color:var(--ng);}
.done .nums .l{font-size:12px;color:var(--dim);}
.done button{padding:11px 24px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px;}

.detail{width:100%;max-width:560px;margin-top:36px;border-top:1px solid var(--line);padding-top:18px;}
.detail summary{font-size:13px;color:var(--dim);list-style:none;}
.detail summary:hover{color:var(--text);}
#rows{margin-top:16px;}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line-soft);border-radius:6px;padding:10px 14px;margin-bottom:8px;}
.row span:first-child{flex:1;font-size:14px;}
.row .b{font-family:var(--mono);font-size:11px;color:var(--dim);}
.row .b.o{color:var(--ok);}
.row .b.x{color:var(--ng);}
#resetBtn{margin-top:14px;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--dim);cursor:pointer;font-size:12px;}
#resetBtn:hover{border-color:var(--ng);color:var(--ng);}

@media(max-width:640px){
  .answers{flex-direction:column;}
  header,#dict{padding-left:18px;padding-right:18px;}
  nav.tabs2{padding-left:18px;padding-right:18px;}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>コード辞典</h1>
    <div class="sub">Python × JavaScript 学習アプリ</div>
    <div class="tabs">
      <button id="t-login" class="on" onclick="setTab('login')">ログイン</button>
      <button id="t-signup" onclick="setTab('signup')">新規登録</button>
    </div>
    <div class="field"><label>ユーザー名</label><input id="u" type="text"></div>
    <div class="field"><label>パスワード</label><input id="p" type="password"></div>
    <div class="field" id="p2wrap" style="display:none"><label>パスワード（確認）</label><input id="p2" type="password"></div>
    <button id="go" onclick="go()">ログイン</button>
    <div id="msg"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>コード辞典</h1>
    <div class="who"><button onclick="toggleGuide()">使い方</button><span id="uname"></span><button onclick="logout()">ログアウト</button></div>
  </header>
  <div id="guide" class="guide">
    <div class="guide-inner">
      <div class="guide-text">
        <div class="guide-title">はじめての方へ — このアプリの使い方</div>
        <ul>
          <li><strong>辞典</strong>タブ：用語を検索したり、カテゴリで絞り込んで読めます</li>
          <li><strong>学習</strong>タブ：フラッシュカードで暗記できます。カードをクリックすると答えが表示されます</li>
          <li>右上の<strong>Python / JavaScript</strong>ボタンで表示言語をいつでも切り替えられます</li>
          <li>カードで「覚えた」「もう一度」を選ぶと、学習記録が自動的に保存されます</li>
        </ul>
      </div>
      <button class="guide-close" onclick="closeGuide()">×</button>
    </div>
  </div>
  <nav class="tabs2">
    <button id="nav-dict" class="on" onclick="showTab('dict')">辞典</button>
    <button id="nav-learn" onclick="showTab('learn')">学習</button>
  </nav>

  <div id="dict">
    <div class="toolbar">
      <div class="toolrow">
        <input id="q" placeholder="検索（例: 変数, for）">
        <div class="langtoggle" id="langtoggle1"></div>
      </div>
      <div class="toolrow">
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div id="entries"></div>
  </div>

  <div id="learn">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <div class="chips" id="cardchips"></div>
      <div class="langtoggle" id="langtoggle2"></div>
      <div class="score" id="score"></div>
    </div>
    <div class="pbar"><i id="pbar"></i></div>
    <div class="card" id="card" onclick="flip()"></div>
    <div class="answers hide" id="answers">
      <button class="no" onclick="event.stopPropagation();ans(false)">✗ もう一度</button>
      <button class="yes" onclick="event.stopPropagation();ans(true)">✓ 覚えた</button>
    </div>
    <div class="navrow" id="navrow">
      <button id="prevB" onclick="step(-1)">← 前へ</button>
      <span id="pos"></span>
      <button id="nextB" onclick="step(1)">次へ →</button>
    </div>
    <div class="done" id="done" style="display:none"></div>

    <details class="detail">
      <summary>学習記録をすべて見る</summary>
      <div id="rows"></div>
      <button id="resetBtn" onclick="resetProgress()">学習記録をリセット</button>
    </details>
  </div>
</div>

<script>
const TERMS=[
{cat:"基本構文",term:"変数",read:"へんすう",def:"値に名前をつけて保存する入れ物。Python は <span class=k>代入するだけ</span>で作れるが、JavaScript は <span class=k>let / const</span> で宣言する。",py:"name = \"Taro\"\nage = 16",js:"let name = \"Taro\";\nconst age = 16;"},
{cat:"基本構文",term:"条件分岐",read:"if文",def:"条件によって処理を分ける構文。Python は <span class=k>コロンとインデント</span>、JavaScript は <span class=k>{ }</span> でブロックを表す。",py:"if age >= 18:\n    print(\"成人\")\nelse:\n    print(\"未成年\")",js:"if (age >= 18) {\n  console.log(\"成人\");\n} else {\n  console.log(\"未成年\");\n}"},
{cat:"基本構文",term:"forループ",read:"for loop",def:"決まった回数や要素数だけ繰り返す構文。",py:"for i in range(3):\n    print(i)",js:"for (let i = 0; i < 3; i++) {\n  console.log(i);\n}"},
{cat:"基本構文",term:"whileループ",read:"while loop",def:"条件が真の間、処理を繰り返す構文。",py:"n = 3\nwhile n > 0:\n    print(n)\n    n -= 1",js:"let n = 3;\nwhile (n > 0) {\n  console.log(n);\n  n--;\n}"},
{cat:"関数",term:"関数",read:"function",def:"処理をまとめて名前をつけ、何度でも呼び出せるようにしたもの。",py:"def greet(name):\n    return f\"こんにちは {name}\"",js:"function greet(name) {\n  return `こんにちは ${name}`;\n}"},
{cat:"関数",term:"アロー関数",read:"arrow function",def:"JavaScript の短い関数の書き方。Python の <span class=k>lambda</span> が近い。",py:"square = lambda x: x * x",js:"const square = (x) => x * x;"},
{cat:"関数",term:"デフォルト引数",read:"default parameter",def:"値を渡さなかった場合に使われる引数の初期値。",py:"def greet(name=\"ゲスト\"):\n    print(name)",js:"function greet(name = \"ゲスト\") {\n  console.log(name);\n}"},
{cat:"データ構造",term:"リスト / 配列",read:"list / array",def:"複数の値を順番に並べる入れ物。",py:"fruits = [\"apple\", \"banana\"]\nfruits.append(\"cherry\")",js:"let fruits = [\"apple\", \"banana\"];\nfruits.push(\"cherry\");"},
{cat:"データ構造",term:"辞書 / オブジェクト",read:"dict / object",def:"キーと値のペアでデータを保存する入れ物。",py:"person = {\"name\": \"Taro\"}\nprint(person[\"name\"])",js:"let person = { name: \"Taro\" };\nconsole.log(person.name);"},
{cat:"データ構造",term:"タプル",read:"tuple",def:"変更できない並びのデータ。JavaScriptには専用の型はない。",py:"point = (3, 4)\nx, y = point",js:"const point = [3, 4];\nconst [x, y] = point;"},
{cat:"オブジェクト指向",term:"クラス",read:"class",def:"オブジェクトの設計図。データとふるまいをまとめて定義する。",py:"class Dog:\n    def __init__(self, name):\n        self.name = name\n    def bark(self):\n        print(f\"{self.name}: ワン\")",js:"class Dog {\n  constructor(name) {\n    this.name = name;\n  }\n  bark() {\n    console.log(`${this.name}: ワン`);\n  }\n}"},
{cat:"オブジェクト指向",term:"継承",read:"inheritance",def:"既存クラスの機能を引き継いで新しいクラスを作るしくみ。",py:"class Puppy(Dog):\n    pass",js:"class Puppy extends Dog {}"},
{cat:"エラー処理",term:"例外処理",read:"try/except, try/catch",def:"エラーを捕まえてプログラムが止まらないようにするしくみ。",py:"try:\n    10 / 0\nexcept ZeroDivisionError:\n    print(\"エラー\")",js:"try {\n  10 / 0;\n} catch (e) {\n  console.log(\"エラー\");\n}"},
{cat:"非同期処理",term:"非同期処理",read:"async/await",def:"処理の完了を待たずに他の処理を進められるしくみ。",py:"import asyncio\nasync def f():\n    await asyncio.sleep(1)",js:"async function f() {\n  await new Promise(r => setTimeout(r, 1000));\n}"},
{cat:"入出力",term:"標準出力",read:"print",def:"画面に文字や値を表示すること。",py:"print(\"Hello, World!\")",js:"console.log(\"Hello, World!\");"},
{cat:"入出力",term:"文字列フォーマット",read:"f文字列 / テンプレート",def:"文字列の中に変数の値を埋め込む書き方。",py:"name = \"花子\"\nprint(f\"こんにちは{name}\")",js:"let name = \"花子\";\nconsole.log(`こんにちは${name}`);"},
{cat:"その他",term:"コメント",read:"comment",def:"動作に影響しない、人間向けのメモ書き。",py:"# コメント\nprint(\"実行される\")",js:"// コメント\nconsole.log(\"実行される\");"},
{cat:"その他",term:"null的な値",read:"None / null",def:"「値が存在しない」ことを表す特別な値。",py:"value = None",js:"let value = null;"},
];
const CATS=[...new Set(TERMS.map(t=>t.cat))];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hl=c=>esc(c).replace(/#.*$/gm,m=>`<span class=c>${m}</span>`).replace(/\/\/.*$/gm,m=>`<span class=c>${m}</span>`);
const codeHtml=(t)=>`<div class="code"><div class="lbl">${lang==='py'?'Python':'JavaScript'}</div><pre>${hl(t[lang])}</pre></div>`;

/* ---- language toggle (global, shared by dict & learn) ---- */
let lang="py";
function buildLangToggle(id,after){
  document.getElementById(id).innerHTML=
    `<button class="${lang==='py'?'on':''}" onclick="setLang('py',${after})">Python</button>
     <button class="${lang==='js'?'on':''}" onclick="setLang('js',${after})">JavaScript</button>`;
}
function setLang(l,which){
  lang=l;
  buildLangToggle("langtoggle1");
  buildLangToggle("langtoggle2");
  if(which===1)renderDict();
  if(which===2){ if(flipped) flipBack(); }
}
function flipBack(){
  const t=deck[idx];
  document.getElementById("card").innerHTML=`<div class="lbl">裏</div><div class="def">${t.def}</div>${codeHtml(t)}`;
}

/* ---- usage guide ---- */
function applyGuideState(){
  const hidden=localStorage.getItem("cd_guide_hidden")==="1";
  document.getElementById("guide").style.display=hidden?"none":"block";
}
function toggleGuide(){
  const g=document.getElementById("guide");
  const willShow=g.style.display==="none";
  g.style.display=willShow?"block":"none";
  localStorage.setItem("cd_guide_hidden",willShow?"0":"1");
}
function closeGuide(){
  document.getElementById("guide").style.display="none";
  localStorage.setItem("cd_guide_hidden","1");
}

/* ---- auth ---- */
const users=()=>JSON.parse(localStorage.getItem("cd_users")||"{}");
const saveUsers=u=>localStorage.setItem("cd_users",JSON.stringify(u));
let user=null, tab="login";
function setTab(t){
  tab=t;
  document.getElementById("t-login").classList.toggle("on",t==="login");
  document.getElementById("t-signup").classList.toggle("on",t==="signup");
  document.getElementById("p2wrap").style.display=t==="signup"?"block":"none";
  document.getElementById("go").textContent=t==="login"?"ログイン":"アカウント作成";
  document.getElementById("msg").textContent="";
}
function setMsg(t,err){const m=document.getElementById("msg");m.textContent=t;m.className=err?"err":"ok";}
function go(){
  const u=document.getElementById("u").value.trim();
  const p=document.getElementById("p").value;
  if(!u||!p){setMsg("ユーザー名とパスワードを入力してください",true);return;}
  const us=users();
  if(tab==="signup"){
    const p2=document.getElementById("p2").value;
    if(p!==p2){setMsg("パスワードが一致しません",true);return;}
    if(us[u]){setMsg("既に使われているユーザー名です",true);return;}
    us[u]={p,prog:{}};saveUsers(us);
    setMsg("作成しました",false);
    setTimeout(()=>login(u),600);
  }else{
    if(!us[u]||us[u].p!==p){setMsg("ユーザー名かパスワードが違います",true);return;}
    login(u);
  }
}
function login(u){
  user=u;localStorage.setItem("cd_session",u);
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("uname").textContent=u;
  applyGuideState();
  buildLangToggle("langtoggle1");
  buildLangToggle("langtoggle2");
  renderDict();
}
function logout(){
  localStorage.removeItem("cd_session");user=null;
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("u").value="";document.getElementById("p").value="";
}

/* ---- progress ---- */
function prog(){const us=users();return (us[user]&&us[user].prog)||{};}
function setProg(term,val){const us=users();us[user].prog[term]=val;saveUsers(us);}
function resetProgress(){
  if(!confirm("リセットしますか？"))return;
  const us=users();us[user].prog={};saveUsers(us);renderProgress();
}

/* ---- dict tab ---- */
let cat="すべて",q="";
function buildChips(){
  document.getElementById("chips").innerHTML=["すべて",...CATS].map(c=>
    `<button class="chip${c===cat?" on":""}" onclick="cat='${c}';renderDict()">${c}</button>`).join("");
}
function renderDict(){
  buildChips();
  buildLangToggle("langtoggle1");
  const items=TERMS.filter(t=>(cat==="すべて"||t.cat===cat)&&(!q||[t.term,t.read,t.py,t.js].join(" ").toLowerCase().includes(q.toLowerCase())));
  document.getElementById("entries").innerHTML=items.length?items.map(t=>`
    <div class="entry">
      <div class="entry-top"><b>${t.term}</b><span class="read">${t.read}</span><span class="tag">${t.cat}</span></div>
      <p>${t.def}</p>
      ${codeHtml(t)}
    </div>`).join(""):`<div class="empty">該当する用語が見つかりません</div>`;
}
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;renderDict();});

/* ---- learn tab: flashcards ---- */
let ccat="すべて",deck=[],idx=0,flipped=false,ok=0,ng=0;
function buildCardChips(){
  document.getElementById("cardchips").innerHTML=["すべて",...CATS].map(c=>
    `<button class="chip${c===ccat?" on":""}" onclick="ccat='${c}';startDeck()">${c}</button>`).join("");
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startDeck(){
  buildCardChips();
  buildLangToggle("langtoggle2");
  deck=shuffle(ccat==="すべて"?TERMS:TERMS.filter(t=>t.cat===ccat));
  idx=0;ok=0;ng=0;
  document.getElementById("done").style.display="none";
  document.getElementById("card").style.display="flex";
  document.getElementById("answers").style.display="flex";
  document.getElementById("navrow").style.display="flex";
  updScore();showCard();
  renderProgress();
}
function updScore(){document.getElementById("score").innerHTML=`<span class=o>✓ ${ok}</span> <span class=x>✗ ${ng}</span>`;}
function showCard(){
  if(idx>=deck.length){finish();return;}
  const t=deck[idx];flipped=false;
  document.getElementById("card").innerHTML=`<div class="lbl">表（クリックで裏返す）</div><div class="term">${t.term}</div><div class="read">${t.read}</div><div class="hint" style="margin-top:auto">クリックして答えを見る</div>`;
  document.getElementById("answers").classList.add("hide");
  document.getElementById("pos").textContent=`${idx+1} / ${deck.length}`;
  document.getElementById("prevB").disabled=idx===0;
  document.getElementById("nextB").disabled=idx>=deck.length-1;
  document.getElementById("pbar").style.width=Math.round(idx/deck.length*100)+"%";
}
function flip(){
  if(idx>=deck.length)return;
  flipped=!flipped;
  if(flipped){
    flipBack();
    document.getElementById("answers").classList.remove("hide");
  }else{
    showCard();
  }
}
function ans(yes){
  setProg(deck[idx].term,yes?"ok":"ng");
  if(yes)ok++;else ng++;
  updScore();
  renderProgress();
  if(idx<deck.length-1){idx++;showCard();}else finish();
}
function step(d){const n=idx+d;if(n<0||n>=deck.length)return;idx=n;showCard();}
function finish(){
  document.getElementById("card").style.display="none";
  document.getElementById("answers").style.display="none";
  document.getElementById("navrow").style.display="none";
  document.getElementById("pbar").style.width="100%";
  document.getElementById("done").style.display="block";
  document.getElementById("done").innerHTML=`<h2>セッション完了！</h2>
    <div class="nums"><div><div class="n o">${ok}</div><div class="l">覚えた</div></div><div><div class="n x">${deck.length-ok}</div><div class="l">もう一度</div></div></div>
    <button onclick="startDeck()">もう一度やり直す</button>`;
}

/* ---- learn tab: progress summary ---- */
function renderProgress(){
  const p=prog();const total=TERMS.length;
  const o=TERMS.filter(t=>p[t.term]==="ok").length;
  const x=TERMS.filter(t=>p[t.term]==="ng").length;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="n">${total}</div><div class="l">総単語数</div></div>
    <div class="stat"><div class="n" style="color:var(--ok)">${o}</div><div class="l">覚えた</div></div>
    <div class="stat"><div class="n" style="color:var(--ng)">${x}</div><div class="l">復習中</div></div>
    <div class="stat"><div class="n">${total-o-x}</div><div class="l">未学習</div></div>`;
  document.getElementById("rows").innerHTML=TERMS.map(t=>{
    const s=p[t.term];
    const b=s==="ok"?'<span class="b o">覚えた</span>':s==="ng"?'<span class="b x">復習中</span>':'<span class="b">未学習</span>';
    return `<div class="row"><span>${t.term}</span>${b}</div>`;
  }).join("");
}

/* ---- tabs ---- */
function showTab(t){
  ["dict","learn"].forEach(x=>{
    document.getElementById("nav-"+x).classList.toggle("on",x===t);
    document.getElementById(x).style.display=x===t?"flex":"none";
  });
  if(t==="learn"){
    if(deck.length===0)startDeck();
    else renderProgress();
  }
}

/* ---- boot ---- */
const saved=localStorage.getItem("cd_session");
if(saved&&users()[saved])login(saved);
showTab("dict");
</script>
